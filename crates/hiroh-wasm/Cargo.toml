[package]
name = "hiroh-wasm"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Hiroh's browser module: device keys, relays, messaging and file transfer on iroh"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103.1", default-features = false }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
iroh-tickets = "1.0.0"
js-sys = "0.3"
n0-future = "0.3"
postcard = { version = "1.1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
