server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Content-Security-Policy, written by csp.sh at start-up.
    include /etc/nginx/hiroh-csp.conf;

    # Hashed bundles: safe to cache for a long time.
    location /assets/ { try_files $uri =404; expires 30d; }

    # The page itself must always be revalidated, so a new deploy shows at
    # once (some browsers otherwise keep serving the previous build).
    location = /index.html {
        # add_header here replaces the server's headers; repeat them all.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        include /etc/nginx/hiroh-csp.conf;
    }

    location / { try_files $uri $uri/ /index.html; }
}
